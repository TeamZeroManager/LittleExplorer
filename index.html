.card{animation:pop .25s ease-out}

p{margin:6px 0;font-size:19px;font-weight:700;line-height:1.3}
.chip{font-size:16px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:22px;text-align:center;padding:8px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:var(--ink);margin:6px 0}

</head>

// Toque = zoom, deslizar = cortar
function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function sd(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let u=l?((px-ax)*dx+(py-ay)*dy)/l:0;u=Math.max(0,Math.min(1,u));return Math.hypot(px-ax-u*dx,py-ay-u*dy)}
function ccw(a,b,c){return (c.y-a.y)*(b.x-a.x)>(b.y-a.y)*(c.x-a.x)}
function inter(a,b,c,d){return ccw(a,c,d)!==ccw(b,c,d)&&ccw(a,b,c)!==ccw(a,b,d)}
function segHit(a,b,c,d){return inter(a,b,c,d)||Math.min(sd(a.x,a.y,c.x,c.y,d.x,d.y),sd(b.x,b.y,c.x,c.y,d.x,d.y),sd(c.x,c.y,a.x,a.y,b.x,b.y),sd(d.x,d.y,a.x,a.y,b.x,b.y))<9}
